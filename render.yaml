# Render Blueprint. Create via Render -> New -> Blueprint, pointed at this repo.
#
# Secrets are deliberately marked sync:false rather than written here — they are
# entered once in the Render dashboard and never committed.
services:
  - type: web
    name: producers-circle
    runtime: node
    plan: starter # Free instances sleep when idle, which breaks Stripe webhooks.
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Liveness only — see /api/health in server/index.ts. A database blip must
    # not trigger a restart loop.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: producers-circle-db
          property: connectionString
      # Generated once by Render and kept stable across deploys.
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

databases:
  - name: producers-circle-db
    plan: basic-256mb # Free Postgres instances are deleted after 30 days.
    region: oregon
    postgresMajorVersion: "16"
